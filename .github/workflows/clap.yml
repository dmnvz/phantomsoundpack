name: Векторы CLAP

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "**/*.wav"
      - "**/metadata.csv"
      - "tools/clap_embed.py"
      - "tools/test_queries.txt"

permissions:
  contents: write

concurrency:
  group: clap
  cancel-in-progress: true

jobs:
  embed:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Кэш модели
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-clap-larger-general-v1

      - name: Зависимости
        run: |
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet "transformers>=4.40,<5" soundfile resampy numpy

      - name: Считаем векторы
        run: python tools/clap_embed.py

      - name: Сохраняем в репозиторий
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add embeddings
          git diff --cached --quiet && exit 0
          git commit -m "Векторы CLAP обновлены"
          git push
